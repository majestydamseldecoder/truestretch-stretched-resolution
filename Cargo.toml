[package]
name = "truestretch"
version = "1.0.0"
edition = "2024"
description = "True stretched resolution for Valorant, Fortnite and CS2, applied on game launch and reverted on exit"
license = "MIT"
readme = "README.md"
keywords = ["stretched-resolution", "valorant", "fortnite", "cs2", "windows"]
categories = ["games"]

[[bin]]
name = "TrueStretch"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_Input_XboxController", "Win32_System_Power", "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem",
  "Win32_UI_Shell", "Win32_System_Com", "Win32_Devices_HumanInterfaceDevice",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
